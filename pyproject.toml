[project]
name = "hypertrade"
version = "0.1.0"
description = "Agent-first crypto trading research and execution harness."
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21",
  "alembic>=1.17.0",
  "anyio>=4.0",
  "backtrader>=1.9.78",
  "fastapi>=0.122.0",
  "greenlet>=3.1",
  "httpx>=0.28.0",
  "itsdangerous>=2.2.0",
  "langgraph>=1.0.0",
  "mcp>=1.27,<2",
  "openai>=2.0.0",
  "opentelemetry-api>=1.30",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.8.0",
  "python-multipart>=0.0.20",
  "rich>=13.9.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "websockets>=15.0.0",
  "yfinance>=0.2.48",
]

[project.optional-dependencies]
agent-evals = [
  "langfuse>=4.0.0",
  "langchain-community>=0.3.16,<0.4",
  "ragas>=0.4.0",
]
tui = [
  "textual==8.2.8",
]

[project.scripts]
hypertrade = "hypertrade.cli:entrypoint"
ht = "hypertrade.cli:entrypoint"

[dependency-groups]
dev = [
  "hypothesis>=6.0.0",
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "textual==8.2.8",
]

[tool.setuptools.package-data]
"hypertrade.evals" = ["*.json"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend/src"]

[[tool.mypy.overrides]]
module = "yfinance"
ignore_missing_imports = true
