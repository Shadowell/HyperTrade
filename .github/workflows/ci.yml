name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hypertrade-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Frontend Linter
        run: pnpm --dir frontend lint

      - name: Frontend Unit Tests
        run: pnpm --dir frontend test

      - name: Frontend Build
        run: pnpm --dir frontend build

  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint and formatting check (ruff)
        run: uv run ruff check backend tests

      - name: Static type checking (mypy)
        run: uv run mypy backend/src

      - name: Run unit and integration tests (pytest)
        run: uv run pytest -q
