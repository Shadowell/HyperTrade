name: CI

# Runs on every pull request so a change is verified before it can reach main, and again on main
# after the merge. Production deploys are triggered by the push to main (deploy.yml), not by this
# workflow, so a red PR check is the only gate that stops a broken change before it ships.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hypertrade-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # A broken workflow otherwise only shows up after the merge, when the deploy runs. This catches
  # YAML, expression and action-input mistakes (and unknown runner labels) while still on the PR.
  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "latest"

      - name: Lint GitHub Actions workflows (actionlint)
        run: uvx --from actionlint-py==1.7.12.25 actionlint -color=false

  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Frontend Linter
        run: pnpm --dir frontend lint

      - name: Frontend Unit Tests
        run: pnpm --dir frontend test

      - name: Frontend Build
        run: pnpm --dir frontend build

  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # --locked fails the job when uv.lock is out of sync with pyproject.toml, instead of
      # silently re-resolving to versions nobody reviewed or audited.
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint and formatting check (ruff)
        run: uv run ruff check backend tests

      - name: Static type checking (mypy)
        run: uv run mypy backend/src

      - name: Run unit and integration tests (pytest)
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          HYPERTRADE_SANDBOX_RLIMIT_NPROC: "512"
        run: uv run pytest -q
