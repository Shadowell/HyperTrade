name: Deploy HyperTrade

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if this SHA was already deployed"
        required: false
        default: "false"
      engine:
        description: 发布执行位置
        type: choice
        options: [server, github]
        default: server

concurrency:
  group: hypertrade-production-deploy
  cancel-in-progress: true

env:
  DEPLOY_ENGINE: ${{ (github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server' }}

# The only repository API call is a read-only `gh api .../commits/main`; deploying needs no write
# access to the repository, so the token is limited to reading contents.
permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server') == 'server'
    runs-on: [self-hosted, hypertrade-production]
    steps:
      - name: Read deployed SHA
        id: deployed
        shell: bash
        run: |
          if [ -f /opt/hypertrade/deploy/last_deployed_sha ]; then
            echo "sha=$(cat /opt/hypertrade/deploy/last_deployed_sha)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether this SHA may deploy
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_sha="${{ github.sha }}"
          deployed="${{ steps.deployed.outputs.sha }}"
          force="${{ github.event.inputs.force_deploy }}"
          tip=""
          if command -v gh >/dev/null 2>&1; then
            tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha || true)
          fi
          if [ -z "$tip" ]; then
            tip=$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          echo "run=$run_sha deployed=$deployed tip=$tip force=$force"
          if [ "$force" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$tip" ] && [ "$run_sha" != "$tip" ]; then
            echo "Refusing stale SHA $run_sha; origin/main tip is $tip"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$deployed" ] && [ "$deployed" = "$run_sha" ]; then
            echo "SHA $run_sha is already deployed"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # This job runs on the self-hosted production runner, so third-party actions are pinned to a
      # commit SHA: a moved or hijacked tag must not be able to run code on the production host.
      - name: Checkout
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Node
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "25"

      - name: Build frontend
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          npm exec --yes pnpm@10 -- -C frontend install --frozen-lockfile
          npm exec --yes pnpm@10 -- -C frontend build

      - name: Sync release to /opt/hypertrade
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          mkdir -p /opt/hypertrade/frontend/dist /opt/hypertrade/deploy
          # 持久备份只放 /var/backups/hypertrade。排除发布根下的 backups，
          # 否则 --delete 会清掉 /opt/hypertrade/backups 里的迁移 dump。
          # 这份排除列表必须与 deploy/from-github.sh 里的 rsync 完全一致（tests/test_deployment_config.py
          # 会校验）：托管引擎的强制命令入口、锁文件和可信镜像只存在于主机，不在仓库里，
          # 漏排除会让 server 引擎的 --delete 把它们删掉或覆盖成 644，托管发布随之 Permission denied。
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '.pytest_cache' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude '.env' \
            --exclude 'data' \
            --exclude 'logs' \
            --exclude 'workspace' \
            --exclude 'deploy/last_deployed_sha' \
            --exclude 'deploy/from-github.sh' \
            --exclude 'deploy/from-github.lock' \
            --exclude 'deploy/github.git/' \
            --exclude '/backups/' \
            ./ /opt/hypertrade/
          rsync -a --delete frontend/dist/ /opt/hypertrade/frontend/dist/

      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          chmod +x /opt/hypertrade/deploy/deploy.sh
          /opt/hypertrade/deploy/deploy.sh

      - name: Record deployed SHA
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: echo "${{ github.sha }}" > /opt/hypertrade/deploy/last_deployed_sha

  deploy-github:
    name: GitHub 托管触发发布
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server') == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure hosted deploy SSH
        env:
          SSH_KEY: ${{ secrets.HYPERTRADE_HOSTED_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HYPERTRADE_HOSTED_KNOWN_HOSTS }}
          HOST: ${{ secrets.HYPERTRADE_HOSTED_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hypertrade_hosted
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/hypertrade_known_hosts
          chmod 600 ~/.ssh/hypertrade_hosted ~/.ssh/hypertrade_known_hosts
      - name: Trigger trusted deploy
        env:
          HOST: ${{ secrets.HYPERTRADE_HOSTED_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hypertrade_hosted \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/hypertrade_known_hosts \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            "root@${HOST}" "$GITHUB_SHA"
      - name: Verify public health
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://hypertrade.notenap.com/ >/dev/null
