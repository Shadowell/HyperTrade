name: Deploy HyperTrade

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if this SHA was already deployed"
        required: false
        default: "false"
      engine:
        description: 发布执行位置
        type: choice
        options: [server, github]
        default: server

concurrency:
  group: hypertrade-production-deploy
  cancel-in-progress: true

env:
  DEPLOY_ENGINE: ${{ (github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server' }}

# The only repository API call is a read-only `gh api .../commits/main`; deploying needs no write
# access to the repository, so the token is limited to reading contents.
permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server') == 'server'
    runs-on: [self-hosted, hypertrade-production]
    steps:
      - name: Read deployed SHA
        id: deployed
        shell: bash
        run: |
          if [ -f /opt/hypertrade/deploy/last_deployed_sha ]; then
            echo "sha=$(cat /opt/hypertrade/deploy/last_deployed_sha)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether this SHA may deploy
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_sha="${{ github.sha }}"
          deployed="${{ steps.deployed.outputs.sha }}"
          force="${{ github.event.inputs.force_deploy }}"
          tip=""
          if command -v gh >/dev/null 2>&1; then
            tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha || true)
          fi
          if [ -z "$tip" ]; then
            tip=$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          echo "run=$run_sha deployed=$deployed tip=$tip force=$force"
          if [ "$force" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$tip" ] && [ "$run_sha" != "$tip" ]; then
            echo "Refusing stale SHA $run_sha; origin/main tip is $tip"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$deployed" ] && [ "$deployed" = "$run_sha" ]; then
            echo "SHA $run_sha is already deployed"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # This job runs on the self-hosted production runner, so third-party actions are pinned to a
      # commit SHA: a moved or hijacked tag must not be able to run code on the production host.
      - name: Checkout
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Check changed paths
        id: changes
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          set -euo pipefail
          if [ "$FORCE_DEPLOY" = "true" ] || [ -z "$DEPLOYED_SHA" ] || [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=200 origin "$DEPLOYED_SHA" >/dev/null 2>&1 || true
          fi
          if ! git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null; then
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$DEPLOYED_SHA" "$GITHUB_SHA" | python3 -c '
          import sys
          paths = [line.strip().lstrip("./") for line in sys.stdin if line.strip()]
          def is_inert(p: str) -> bool:
              return p.startswith(("docs/", ".agents/", ".claude/", ".cursor/", ".github/ISSUE_TEMPLATE/")) or p.endswith(".md")
          sys.exit(0 if paths and all(is_inert(p) for p in paths) else 1)
          '; then
            echo "Docs-only change detected ($DEPLOYED_SHA..$GITHUB_SHA); recording SHA without rebuild."
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.deploy == 'true' && steps.changes.outputs.needs_deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "25"

      - name: Build frontend
        if: steps.gate.outputs.deploy == 'true' && steps.changes.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cache_root="${HOME}/.cache/hypertrade-ci"
          mkdir -p "$cache_root"
          frontend_hash="$({ git rev-parse "${GITHUB_SHA}:frontend"; sha256sum frontend/pnpm-lock.yaml frontend/package.json; } | sha256sum | awk '{print $1}')"
          cached_dist="${cache_root}/dist-${frontend_hash}"
          if [ -f "${cached_dist}/index.html" ]; then
            echo "Reusing cached frontend dist (${frontend_hash})"
            rm -rf frontend/dist
            cp -a "${cached_dist}" frontend/dist
            exit 0
          fi

          pnpm_bin=""
          if command -v pnpm >/dev/null 2>&1 && pnpm --version 2>/dev/null | grep -q '^10\.'; then
            pnpm_bin="$(command -v pnpm)"
          elif [ -x "${cache_root}/pnpm10/node_modules/.bin/pnpm" ]; then
            pnpm_bin="${cache_root}/pnpm10/node_modules/.bin/pnpm"
          else
            npm --prefix "${cache_root}/pnpm10" install --no-save pnpm@10.17.1 >/dev/null
            pnpm_bin="${cache_root}/pnpm10/node_modules/.bin/pnpm"
          fi
          export PNPM_HOME="${cache_root}/pnpm-home"
          store_dir="${cache_root}/pnpm-store"
          mkdir -p "$PNPM_HOME" "$store_dir"

          lock_hash="$(sha256sum frontend/pnpm-lock.yaml | awk '{print $1}')"
          cached_nm="${cache_root}/nm-${lock_hash}"
          if [ -d "${cached_nm}/node_modules" ]; then
            rm -rf frontend/node_modules
            cp -al "${cached_nm}/node_modules" frontend/node_modules 2>/dev/null || cp -a "${cached_nm}/node_modules" frontend/node_modules
          fi
          if ! [ -d frontend/node_modules ] || ! frontend/node_modules/.bin/tsc --version >/dev/null 2>&1 || ! frontend/node_modules/.bin/vite --version >/dev/null 2>&1; then
            rm -rf "${cached_nm}" "${cached_nm}.tmp" frontend/node_modules
            "$pnpm_bin" -C frontend install --frozen-lockfile --store-dir "$store_dir"
            mkdir -p "${cached_nm}.tmp"
            cp -al frontend/node_modules "${cached_nm}.tmp/node_modules" 2>/dev/null || cp -a frontend/node_modules "${cached_nm}.tmp/node_modules"
            mv -T "${cached_nm}.tmp" "${cached_nm}"
            python3 - "$cache_root" <<'PY'
          import pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          old = sorted(root.glob("nm-*"), key=lambda p: p.stat().st_mtime, reverse=True)[2:]
          for p in old:
              shutil.rmtree(p, ignore_errors=True)
          PY
          fi

          mkdir -p frontend/node_modules/.tmp
          if [ -f "${cache_root}/ts-${lock_hash}.tsbuildinfo" ]; then
            cp -f "${cache_root}/ts-${lock_hash}.tsbuildinfo" frontend/node_modules/.tmp/tsconfig.tsbuildinfo || true
          fi
          "$pnpm_bin" -C frontend build
          if [ -f frontend/node_modules/.tmp/tsconfig.tsbuildinfo ]; then
            cp -f frontend/node_modules/.tmp/tsconfig.tsbuildinfo "${cache_root}/ts-${lock_hash}.tsbuildinfo" || true
          fi
          rm -rf "${cached_dist}.tmp" "${cached_dist}"
          cp -a frontend/dist "${cached_dist}.tmp"
          mv -T "${cached_dist}.tmp" "${cached_dist}"
          python3 - "$cache_root" <<'PY'
          import pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          old = sorted(root.glob("dist-*"), key=lambda p: p.stat().st_mtime, reverse=True)[3:]
          for p in old:
              shutil.rmtree(p, ignore_errors=True)
          PY

      # Written into the tree that is synced below and baked into the image, so the running API
      # can say which commit it is (GET /api/version). The hosted engine gets the same file from
      # `git archive` through the export-subst rule in .gitattributes.
      - name: Stamp build identity
        if: steps.gate.outputs.deploy == 'true' && steps.changes.outputs.needs_deploy == 'true'
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
        run: printf '%s\n' "$BUILD_SHA" > backend/src/hypertrade/BUILD_INFO

      - name: Sync release to /opt/hypertrade
        if: steps.gate.outputs.deploy == 'true' && steps.changes.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          mkdir -p /opt/hypertrade/frontend/dist /opt/hypertrade/deploy
          # 持久备份只放 /var/backups/hypertrade。排除发布根下的 backups，
          # 否则 --delete 会清掉 /opt/hypertrade/backups 里的迁移 dump。
          # 这份排除列表必须与 deploy/from-github.sh 里的 rsync 完全一致（tests/test_deployment_config.py
          # 会校验）：托管引擎的强制命令入口、锁文件和可信镜像只存在于主机，不在仓库里，
          # 漏排除会让 server 引擎的 --delete 把它们删掉或覆盖成 644，托管发布随之 Permission denied。
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '.pytest_cache' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude '.env' \
            --exclude 'data' \
            --exclude 'logs' \
            --exclude 'workspace' \
            --exclude 'deploy/last_deployed_sha' \
            --exclude 'deploy/from-github.sh' \
            --exclude 'deploy/from-github.lock' \
            --exclude 'deploy/github.git/' \
            --exclude '/backups/' \
            ./ /opt/hypertrade/
          rsync -a --delete frontend/dist/ /opt/hypertrade/frontend/dist/

      - name: Deploy
        if: steps.gate.outputs.deploy == 'true' && steps.changes.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          chmod +x /opt/hypertrade/deploy/deploy.sh
          /opt/hypertrade/deploy/deploy.sh

      # deploy.sh only proves the API answers; this proves it is the build that was just shipped.
      # The SHA is recorded below only when it matches, so a mismatch is retried by the next run.
      - name: Verify the deployed build
        if: steps.gate.outputs.deploy == 'true' && steps.changes.outputs.needs_deploy == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            deployed=$(curl -fsS --max-time 10 http://127.0.0.1:3334/api/version \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha") or "")' 2>/dev/null || true)
            if [ "$deployed" = "$EXPECTED_SHA" ]; then
              echo "the running API reports build $EXPECTED_SHA"
              exit 0
            fi
            echo "attempt $attempt: the API reports '${deployed:-<none>}', expected $EXPECTED_SHA"
            sleep 5
          done
          echo "the running API never reported build $EXPECTED_SHA" >&2
          exit 1

      - name: Record deployed SHA
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: echo "${{ github.sha }}" > /opt/hypertrade/deploy/last_deployed_sha

  deploy-github:
    name: GitHub 托管触发发布
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server') == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure hosted deploy SSH
        env:
          SSH_KEY: ${{ secrets.HYPERTRADE_HOSTED_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HYPERTRADE_HOSTED_KNOWN_HOSTS }}
          HOST: ${{ secrets.HYPERTRADE_HOSTED_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hypertrade_hosted
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/hypertrade_known_hosts
          chmod 600 ~/.ssh/hypertrade_hosted ~/.ssh/hypertrade_known_hosts
      - name: Trigger trusted deploy
        env:
          HOST: ${{ secrets.HYPERTRADE_HOSTED_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hypertrade_hosted \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/hypertrade_known_hosts \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            "root@${HOST}" "$GITHUB_SHA"
      - name: Verify public health
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://hypertrade.notenap.com/ >/dev/null
      # A green SSH step only means the host script exited 0. Ask the public site which commit it
      # is serving, so a deploy that did not actually replace the running build fails here.
      - name: Verify the deployed build
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            deployed=$(curl -fsS --max-time 10 https://hypertrade.notenap.com/api/version \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha") or "")' 2>/dev/null || true)
            if [ "$deployed" = "$EXPECTED_SHA" ]; then
              echo "the site reports build $EXPECTED_SHA"
              exit 0
            fi
            echo "attempt $attempt: the site reports '${deployed:-<none>}', expected $EXPECTED_SHA"
            sleep 10
          done
          echo "::error::the site never reported build $EXPECTED_SHA after the deploy"
          exit 1
