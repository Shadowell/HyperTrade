name: Security

# Audits the dependencies that actually ship, not the whole development toolchain:
#   * Python: the closure the production image installs (`uv sync --frozen --no-dev`).
#   * Frontend: production dependencies only (`pnpm audit --prod`).
# Advisories are published every day, so besides push/PR the audit also runs weekly. A red run on
# an unrelated PR means a new advisory landed against a locked package: bump it (Dependabot opens
# a grouped PR) rather than ignoring the check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hypertrade-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      # --locked: fail if uv.lock does not match pyproject.toml, so the audited set is the
      # committed one. --no-dev: the production image never installs the dev group.
      - name: Export the production dependency closure
        run: >
          uv export --locked --no-dev --no-hashes --no-emit-project --format requirements-txt
          --output-file "$RUNNER_TEMP/requirements-prod.txt"

      - name: Audit against the PyPI / OSV advisory database
        run: uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements-prod.txt" --disable-pip --no-deps

  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.17.1

      - name: Audit production dependencies
        run: pnpm --dir frontend audit --prod --audit-level moderate
