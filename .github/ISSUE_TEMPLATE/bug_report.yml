name: Bug Report
description: Create a report to help us improve HyperTrade
title: "fix: [Short bug description]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'ht research start ...'
        2. Inspect mission logs at '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: market
    attributes:
      label: Market Target
      description: Which market adapter was active when the issue occurred?
      options:
        - BitPro (Crypto SWAP)
        - QuantLab (A-Shares Equity)
        - Core Agent Runtime (Market-agnostic)
        - Sandbox / ASTGatekeeper
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Diagnostic Output
      description: Relevant terminal logs or error tracebacks.
      render: shell
