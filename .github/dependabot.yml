version: 2

# One grouped PR per ecosystem per week keeps the volume reviewable. Each PR runs the full CI and
# the dependency audit, so a bump only lands when the whole suite still passes.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The MCP client/server API is a contract with BitPro; a new major is a planned migration.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # Keeps the commit-SHA pins in .github/workflows current (the `# vN` comment is rewritten too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
