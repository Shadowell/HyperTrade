services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hypertrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypertrade}
      POSTGRES_USER: ${POSTGRES_USER:-hypertrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hypertrade}
    volumes:
      - /opt/hypertrade/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hypertrade} -d ${POSTGRES_DB:-hypertrade}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hypertrade

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hypertrade-api
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hypertrade}:${POSTGRES_PASSWORD:-hypertrade}@postgres:5432/${POSTGRES_DB:-hypertrade}
      # The server-local file is mounted as a read-only Compose secret. An
      # empty /dev/null fallback leaves Codex disabled without exposing OAuth.
      CODEX_AUTH_JSON: /run/secrets/hypertrade_codex_auth
    ports:
      - "127.0.0.1:3334:3334"
    volumes:
      - ${BITPRO_HOST_DATA_DIR:-/opt/bitpro/data}:/bitpro-data:ro
      # This is an IPC directory containing only the sandbox UDS. It is not a
      # Docker socket and the API mount is read-only.
      - ${AGENT_STRATEGY_SANDBOX_SOCKET_DIR:-/opt/hypertrade/workspace/sandbox-ipc}:/run/hypertrade-sandbox:ro
    secrets:
      - source: codex_auth
        target: hypertrade_codex_auth
        mode: 0400
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
    networks:
      - hypertrade

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hypertrade-worker
    restart: unless-stopped
    command: ["python", "-m", "hypertrade.worker"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hypertrade}:${POSTGRES_PASSWORD:-hypertrade}@postgres:5432/${POSTGRES_DB:-hypertrade}
      # Background Agent work uses the same read-only provider credential as
      # the API, never a copied OAuth token in the environment file.
      CODEX_AUTH_JSON: /run/secrets/hypertrade_codex_auth
    volumes:
      - ${BITPRO_HOST_DATA_DIR:-/opt/bitpro/data}:/bitpro-data:ro
    secrets:
      - source: codex_auth
        target: hypertrade_codex_auth
        mode: 0400
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hypertrade

  sandbox:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: sandbox
    image: hypertrade-sandbox:latest
    container_name: hypertrade-sandbox
    restart: unless-stopped
    command: ["python", "-m", "hypertrade.sandbox_service"]
    # The service accepts only API-owned Unix-socket requests. It has no
    # network namespace, provider secret, BitPro volume or Docker socket.
    network_mode: "none"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    environment:
      SANDBOX_SOCKET_PATH: /run/hypertrade-sandbox/runner.sock
      SANDBOX_IMAGE_DIGEST: ${AGENT_STRATEGY_SANDBOX_IMAGE:-}
    volumes:
      - ${AGENT_STRATEGY_SANDBOX_SOCKET_DIR:-/opt/hypertrade/workspace/sandbox-ipc}:/run/hypertrade-sandbox:rw

  cli:
    profiles: ["cli"]
    image: hypertrade-tui:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tui
    env_file:
      - .env
    environment:
      HYPERTRADE_API_URL: http://api:3334
    depends_on:
      - api
    networks:
      - hypertrade

networks:
  hypertrade:
    name: hypertrade

secrets:
  codex_auth:
    # /dev/null keeps Codex unavailable for default/local deployments. A
    # production operator explicitly supplies CODEX_AUTH_SOURCE_PATH instead.
    file: ${CODEX_AUTH_SOURCE_PATH:-/dev/null}
