[package]
name = "hypertrade-bot"
version = "0.1.0"
description = "Always-on-top HyperTrade Mission assistant"
authors = ["HyperTrade"]
edition = "2021"

[lib]
name = "hypertrade_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
url = "2.5"
