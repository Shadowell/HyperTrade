    <rect class="badge badge-governance" x="30" y="525" width="36" height="36"/>
    <text x="48" y="549" class="layer-num" text-anchor="middle">3</text>
    <text x="76" y="549" class="layer-title" fill="#44337a">Governance Gateway</text>

    <rect class="panel panel-governance" x="30" y="525" width="390" height="200"/>

    <rect class="card" x="50" y="575" width="170" height="60"/>
    <text x="135" y="593" class="card-title" text-anchor="middle">Provider Router</text>
    <text x="135" y="610" class="card-text" text-anchor="middle">Vide Coding / DeepSeek</text>
    <text x="135" y="625" class="card-text" text-anchor="middle">OpenAI / Codex / Qwen</text>

    <rect class="card" x="240" y="575" width="160" height="60"/>
    <text x="320" y="593" class="card-title" text-anchor="middle">ToolRegistry</text>
    <text x="320" y="610" class="card-text" text-anchor="middle">schema / scope</text>
    <text x="320" y="625" class="card-text" text-anchor="middle">approval / idempotency</text>

    <rect class="card" x="50" y="650" width="170" height="55"/>
    <text x="135" y="668" class="card-title" text-anchor="middle">Risk Governance</text>
    <text x="135" y="685" class="card-text" text-anchor="middle">approval gates</text>
    <text x="135" y="697" class="card-text" text-anchor="middle">idempotency / live block</text>

    <rect class="card" x="240" y="650" width="160" height="55"/>
    <text x="320" y="668" class="card-title" text-anchor="middle">Trace &amp; Audit</text>
    <text x="320" y="685" class="card-text" text-anchor="middle">graph nodes / tool calls</text>
    <text x="320" y="697" class="card-text" text-anchor="middle">policy decisions</text>
  </g>

  <!-- ========== MIDDLE COLUMN: Engine + World Model ========== -->

  <!-- Arrow from top to engine -->
  <path class="arrow" d="M 420 625 L 450 625"/>

  <!-- Layer 4: Agent Engine -->
