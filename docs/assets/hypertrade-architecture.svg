    <text x="540" y="840" class="card-text" text-anchor="middle">market / paper</text>
    <text x="540" y="850" class="small-text" text-anchor="middle">monitor / RAG</text>

    <rect class="card" x="650" y="805" width="180" height="50"/>
    <text x="740" y="823" class="card-title" text-anchor="middle">Connector Framework</text>
    <text x="740" y="840" class="card-text" text-anchor="middle">BitPro / OKX</text>
    <text x="740" y="850" class="small-text" text-anchor="middle">Fixtures</text>

    <rect class="card" x="850" y="805" width="180" height="50"/>
    <text x="940" y="823" class="card-title" text-anchor="middle">Alembic Migrations</text>
    <text x="940" y="840" class="card-text" text-anchor="middle">7 schema versions</text>

    <rect class="card" x="1050" y="805" width="180" height="50"/>
    <text x="1140" y="823" class="card-title" text-anchor="middle">Server Secrets</text>
    <text x="1140" y="840" class="card-text" text-anchor="middle">OKX / BitPro</text>
    <text x="1140" y="850" class="small-text" text-anchor="middle">provider keys</text>

    <rect class="card" x="1250" y="805" width="180" height="50"/>
    <text x="1340" y="823" class="card-title" text-anchor="middle">CI / CD</text>
    <text x="1340" y="840" class="card-text" text-anchor="middle">GitHub Actions</text>
    <text x="1340" y="850" class="small-text" text-anchor="middle">Docker Compose</text>

    <rect class="card" x="1450" y="805" width="180" height="50"/>
    <text x="1540" y="823" class="card-title" text-anchor="middle">Agent Evals</text>
    <text x="1540" y="840" class="card-text" text-anchor="middle">deterministic</text>
    <text x="1540" y="850" class="small-text" text-anchor="middle">guardrails</text>

    <rect class="card" x="1650" y="805" width="200" height="50"/>
    <text x="1750" y="823" class="card-title" text-anchor="middle">Monitor</text>
    <text x="1750" y="840" class="card-text" text-anchor="middle">loop / alerts</text>

    <text x="135" y="875" class="small-text" text-anchor="middle">Python-native</text>
    <text x="340" y="875" class="small-text" text-anchor="middle">Source-backed</text>
    <text x="540" y="875" class="small-text" text-anchor="middle">Self-hosted</text>
    <text x="740" y="875" class="small-text" text-anchor="middle">Risk-gated</text>
    <text x="940" y="875" class="small-text" text-anchor="middle">Audit-first</text>
    <text x="1140" y="875" class="small-text" text-anchor="middle">Secure</text>
    <text x="1340" y="875" class="small-text" text-anchor="middle">Automated</text>
    <text x="1540" y="875" class="small-text" text-anchor="middle">Extensible</text>
    <text x="1750" y="875" class="small-text" text-anchor="middle">Observable</text>
  </g>

  <!-- ========== LAYER 10: CLOSED-LOOP WORKFLOW (Full Width Bottom) ========== -->
  <g id="layer-10">
    <rect class="badge badge-workflow" x="30" y="915" width="36" height="36"/>
    <text x="48" y="939" class="layer-num" text-anchor="middle">10</text>
    <text x="76" y="939" class="layer-title" fill="#1d4ed8">Closed-Loop AI Trading Workflow</text>

    <rect class="panel panel-workflow" x="30" y="915" width="1840" height="100"/>

    <!-- Workflow steps with arrows -->
    <g transform="translate(120, 960)">
      <text x="0" y="15" class="card-title">Agent</text>
      <path class="arrow" d="M 60 8 L 110 8"/>

      <text x="120" y="15" class="card-title">Market Research</text>
      <path class="arrow" d="M 240 8 L 290 8"/>

      <text x="300" y="15" class="card-title">Strategy Code</text>
      <path class="arrow" d="M 410 8 L 460 8"/>

      <text x="470" y="15" class="card-title">Validate</text>
      <path class="arrow" d="M 550 8 L 600 8"/>

      <text x="610" y="15" class="card-title">Backtest</text>
      <path class="arrow" d="M 700 8 L 750 8"/>

      <text x="760" y="15" class="card-title">Paper / Monitor</text>
      <path class="arrow" d="M 880 8 L 930 8"/>

      <text x="940" y="15" class="card-title">Memory Feedback</text>
    </g>

    <text x="950" y="1000" class="card-text" text-anchor="middle">Research → Strategy code → Validate → BitPro backtest → Paper monitoring → Evidence feedback</text>
  </g>

  <!-- Bottom description -->
  <text x="950" y="1040" class="small-text" text-anchor="middle" fill="#718096">Operator / Agent → Provider planning → Governance → Tool execution → Report → Memory → Next iteration</text>
</svg>
