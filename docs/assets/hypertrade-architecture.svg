<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc">
  <title id="title">HyperTrade Architecture</title>
  <desc id="desc">HyperTrade layered architecture with clear visual hierarchy and spacing</desc>

  <defs>
    <style>
      .bg{fill:#fafbfc}
      .title{font:bold 72px system-ui,sans-serif;fill:#1a202c}
      .subtitle{font:500 24px system-ui,sans-serif;fill:#4a5568}
      .layer-title{font:bold 28px system-ui,sans-serif;fill:#2d3748}
      .card-title{font:600 18px system-ui,sans-serif;fill:#1a202c}
      .card-text{font:400 14px system-ui,sans-serif;fill:#4a5568}
      .label-text{font:500 16px system-ui,sans-serif;fill:#2d3748}

      .layer-client{fill:#ebf4ff;stroke:#3182ce;stroke-width:3}
      .layer-data{fill:#f0fff4;stroke:#38a169;stroke-width:3}
      .layer-governance{fill:#faf5ff;stroke:#805ad5;stroke-width:3}
      .layer-engine{fill:#e6fffa;stroke:#319795;stroke-width:3}
      .layer-world{fill:#fffaf0;stroke:#dd6b20;stroke-width:3}
      .layer-output{fill:#fff5f5;stroke:#e53e3e;stroke-width:3}

      .card{fill:#ffffff;stroke:#cbd5e0;stroke-width:2;rx:8}
      .card-client{fill:#ffffff;stroke:#3182ce;stroke-width:2}
      .card-data{fill:#ffffff;stroke:#38a169;stroke-width:2}
      .card-governance{fill:#ffffff;stroke:#805ad5;stroke-width:2}
      .card-engine{fill:#ffffff;stroke:#319795;stroke-width:2}
      .card-world{fill:#ffffff;stroke:#dd6b20;stroke-width:2}
      .card-output{fill:#ffffff;stroke:#e53e3e;stroke-width:2}

      .arrow{stroke:#3182ce;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
      .arrow-feedback{stroke:#805ad5;stroke-width:3;fill:none;stroke-dasharray:8 8;marker-end:url(#arrowhead-purple)}

      .shadow{filter:url(#shadow)}
    </style>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3182ce"/>
    </marker>

    <marker id="arrowhead-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#805ad5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="2000" height="1400"/>

  <!-- Title -->
  <text x="1000" y="80" class="title" text-anchor="middle">HyperTrade Architecture</text>
  <text x="1000" y="120" class="subtitle" text-anchor="middle">AI-Native Crypto Trading Agent — Research, Strategy, Risk-Gated Execution</text>

  <!-- ========== LAYER 1: CLIENT ACCESS ========== -->
  <g id="layer-client">
    <rect x="100" y="180" width="1800" height="140" rx="12" class="layer-client shadow"/>
    <text x="120" y="215" class="layer-title" fill="#2c5282">1. Client / Agent Access</text>

    <!-- Client Cards -->
    <g transform="translate(120, 240)">
      <rect x="0" y="0" width="270" height="60" class="card-client shadow"/>
      <text x="135" y="28" class="card-title" text-anchor="middle">CLI / ht</text>
      <text x="135" y="48" class="card-text" text-anchor="middle">Terminal Interface</text>
    </g>

    <g transform="translate(420, 240)">
      <rect x="0" y="0" width="270" height="60" class="card-client shadow"/>
      <text x="135" y="28" class="card-title" text-anchor="middle">/harness</text>
      <text x="135" y="48" class="card-text" text-anchor="middle">Web Console</text>
    </g>

    <g transform="translate(720, 240)">
      <rect x="0" y="0" width="270" height="60" class="card-client shadow"/>
      <text x="135" y="28" class="card-title" text-anchor="middle">REST / SSE API</text>
      <text x="135" y="48" class="card-text" text-anchor="middle">HTTP Endpoints</text>
    </g>

    <g transform="translate(1020, 240)">
      <rect x="0" y="0" width="270" height="60" class="card-client shadow"/>
      <text x="135" y="28" class="card-title" text-anchor="middle">Codex Agent</text>
      <text x="135" y="48" class="card-text" text-anchor="middle">External Integration</text>
    </g>

    <g transform="translate(1320, 240)">
      <rect x="0" y="0" width="270" height="60" class="card-client shadow"/>
      <text x="135" y="28" class="card-title" text-anchor="middle">Custom MCP Clients</text>
      <text x="135" y="48" class="card-text" text-anchor="middle">Future Extensibility</text>
    </g>
  </g>

  <!-- Arrow: Client -> Data/Governance -->
  <path class="arrow" d="M 1000 320 L 1000 380"/>

  <!-- ========== LAYER 2: DATA & INPUTS (LEFT) ========== -->
  <g id="layer-data">
    <rect x="100" y="400" width="580" height="280" rx="12" class="layer-data shadow"/>
    <text x="120" y="435" class="layer-title" fill="#22543d">2. Data & Inputs</text>

    <g transform="translate(120, 460)">
      <rect x="0" y="0" width="260" height="100" class="card-data shadow"/>
      <text x="130" y="30" class="card-title" text-anchor="middle">OKX Market Data</text>
      <text x="130" y="55" class="card-text" text-anchor="middle">Tickers / Candles</text>
      <text x="130" y="75" class="card-text" text-anchor="middle">Funding / OI</text>
    </g>

    <g transform="translate(400, 460)">
      <rect x="0" y="0" width="260" height="100" class="card-data shadow"/>
      <text x="130" y="30" class="card-title" text-anchor="middle">BitPro MCP/API</text>
      <text x="130" y="55" class="card-text" text-anchor="middle">Strategy Lifecycle</text>
      <text x="130" y="75" class="card-text" text-anchor="middle">Backtest / Paper</text>
    </g>

    <g transform="translate(120, 580)">
      <rect x="0" y="0" width="260" height="80" class="card-data shadow"/>
      <text x="130" y="30" class="card-title" text-anchor="middle">RAG / Knowledge</text>
      <text x="130" y="55" class="card-text" text-anchor="middle">pgvector Search</text>
    </g>

    <g transform="translate(400, 580)">
      <rect x="0" y="0" width="260" height="80" class="card-data shadow"/>
      <text x="130" y="30" class="card-title" text-anchor="middle">Audited Memory</text>
      <text x="130" y="55" class="card-text" text-anchor="middle">Strategy Evidence</text>
    </g>
  </g>

  <!-- ========== LAYER 3: GOVERNANCE (RIGHT OF DATA) ========== -->
  <g id="layer-governance">
    <rect x="720" y="400" width="580" height="280" rx="12" class="layer-governance shadow"/>
    <text x="740" y="435" class="layer-title" fill="#44337a">3. Governance Gateway</text>

    <g transform="translate(740, 460)">
      <rect x="0" y="0" width="260" height="100" class="card-governance shadow"/>
      <text x="130" y="30" class="card-title" text-anchor="middle">Provider Router</text>
      <text x="130" y="55" class="card-text" text-anchor="middle">Vide Coding / DeepSeek</text>
      <text x="130" y="75" class="card-text" text-anchor="middle">OpenAI / Codex / Qwen</text>
    </g>

    <g transform="translate(1020, 460)">
      <rect x="0" y="0" width="260" height="100" class="card-governance shadow"/>
      <text x="130" y="30" class="card-title" text-anchor="middle">Tool Registry</text>
      <text x="130" y="55" class="card-text" text-anchor="middle">Schema / Scope</text>
      <text x="130" y="75" class="card-text" text-anchor="middle">Approval / Idempotency</text>
    </g>

    <g transform="translate(740, 580)">
      <rect x="0" y="0" width="260" height="80" class="card-governance shadow"/>
      <text x="130" y="30" class="card-title" text-anchor="middle">Risk Policy</text>
      <text x="130" y="55" class="card-text" text-anchor="middle">Approval Gates</text>
    </g>

    <g transform="translate(1020, 580)">
      <rect x="0" y="0" width="260" height="80" class="card-governance shadow"/>
      <text x="130" y="30" class="card-title" text-anchor="middle">Trace & Audit</text>
      <text x="130" y="55" class="card-text" text-anchor="middle">Execution Log</text>
    </g>
  </g>

  <!-- Arrow: Data/Governance -> Engine -->
  <path class="arrow" d="M 390 680 L 390 730"/>
  <path class="arrow" d="M 1010 680 L 1010 730"/>

  <!-- ========== LAYER 4: AGENT ENGINE ========== -->
  <g id="layer-engine">
    <rect x="100" y="750" width="900" height="280" rx="12" class="layer-engine shadow"/>
    <text x="120" y="785" class="layer-title" fill="#234e52">4. Agent Engine</text>

    <g transform="translate(120, 810)">
      <rect x="0" y="0" width="860" height="70" class="card-engine shadow"/>
      <text x="430" y="30" class="card-title" text-anchor="middle">AgentKernel Graph Runtime</text>
      <text x="430" y="52" class="card-text" text-anchor="middle">intent → plan → approve → execute → reflect → report</text>
    </g>

    <g transform="translate(120, 900)">
      <rect x="0" y="0" width="410" height="60" class="card-engine shadow"/>
      <text x="205" y="28" class="card-title" text-anchor="middle">Planner + Tool Calling</text>
      <text x="205" y="48" class="card-text" text-anchor="middle">Market / RAG / Memory / BitPro</text>
    </g>

    <g transform="translate(570, 900)">
      <rect x="0" y="0" width="410" height="60" class="card-engine shadow"/>
      <text x="205" y="28" class="card-title" text-anchor="middle">Market Intelligence</text>
      <text x="205" y="48" class="card-text" text-anchor="middle">Funding / OI / Indicators</text>
    </g>

    <g transform="translate(120, 980)">
      <rect x="0" y="0" width="860" height="60" class="card-engine shadow"/>
      <text x="430" y="28" class="card-title" text-anchor="middle">Strategy Research Loop</text>
      <text x="430" y="48" class="card-text" text-anchor="middle">evidence → experiment → library → iteration</text>
    </g>
  </g>

  <!-- ========== LAYER 5: WORLD MODEL ========== -->
  <g id="layer-world">
    <rect x="1040" y="750" width="560" height="140" rx="12" class="layer-world shadow"/>
    <text x="1060" y="785" class="layer-title" fill="#7c2d12">5. World Model</text>

    <g transform="translate(1060, 810)">
      <rect x="0" y="0" width="250" height="60" class="card-world shadow"/>
      <text x="125" y="28" class="card-title" text-anchor="middle">WorldState Snapshot</text>
      <text x="125" y="48" class="card-text" text-anchor="middle">Global + Crypto State</text>
    </g>

    <g transform="translate(1330, 810)">
      <rect x="0" y="0" width="250" height="60" class="card-world shadow"/>
      <text x="125" y="28" class="card-title" text-anchor="middle">Scenario Decision</text>
      <text x="125" y="48" class="card-text" text-anchor="middle">Action Scoring</text>
    </g>
  </g>

  <!-- ========== LAYER 6: EXECUTION & OUTPUT ========== -->
  <g id="layer-output">
    <rect x="1040" y="920" width="560" height="280" rx="12" class="layer-output shadow"/>
    <text x="1060" y="955" class="layer-title" fill="#742a2a">6. Execution & Output</text>

    <g transform="translate(1060, 980)">
      <rect x="0" y="0" width="520" height="60" class="card-output shadow"/>
      <text x="260" y="28" class="card-title" text-anchor="middle">Operator Reports</text>
      <text x="260" y="48" class="card-text" text-anchor="middle">CLI / Web / API — Markdown + JSON</text>
    </g>

    <g transform="translate(1060, 1060)">
      <rect x="0" y="0" width="250" height="60" class="card-output shadow"/>
      <text x="125" y="28" class="card-title" text-anchor="middle">BitPro Lifecycle</text>
      <text x="125" y="48" class="card-text" text-anchor="middle">Create / Backtest</text>
    </g>

    <g transform="translate(1330, 1060)">
      <rect x="0" y="0" width="250" height="60" class="card-output shadow"/>
      <text x="125" y="28" class="card-title" text-anchor="middle">Paper Trading</text>
      <text x="125" y="48" class="card-text" text-anchor="middle">Simulation Runtime</text>
    </g>

    <g transform="translate(1060, 1140)">
      <rect x="0" y="0" width="520" height="60" class="card-output shadow"/>
      <text x="260" y="28" class="card-title" text-anchor="middle">Risk-Gated Execution</text>
      <text x="260" y="48" class="card-text" text-anchor="middle">OKX Testnet Only — Mainnet Blocked</text>
    </g>
  </g>

  <!-- Main flow arrows -->
  <path class="arrow" d="M 550 1030 L 1040 1100"/>
  <path class="arrow" d="M 1320 890 L 1320 920"/>

  <!-- Feedback loop -->
  <path class="arrow-feedback" d="M 530 650 L 530 730"/>
  <text x="550" y="700" class="card-text" fill="#805ad5">Memory</text>
  <text x="550" y="720" class="card-text" fill="#805ad5">Feedback</text>

  <!-- ========== LAYER 7: INFRASTRUCTURE ========== -->
  <g id="layer-infra">
    <rect x="100" y="1240" width="1800" height="120" rx="12" class="layer-client shadow"/>
    <text x="120" y="1275" class="layer-title" fill="#2c5282">7. Foundation & Infrastructure</text>

    <g transform="translate(120, 1290)">
      <rect x="0" y="0" width="220" height="50" class="card shadow"/>
      <text x="110" y="32" class="card-text" text-anchor="middle">PostgreSQL + pgvector</text>
    </g>

    <g transform="translate(360, 1290)">
      <rect x="0" y="0" width="220" height="50" class="card shadow"/>
      <text x="110" y="32" class="card-text" text-anchor="middle">Async Workers</text>
    </g>

    <g transform="translate(600, 1290)">
      <rect x="0" y="0" width="220" height="50" class="card shadow"/>
      <text x="110" y="32" class="card-text" text-anchor="middle">Connector Framework</text>
    </g>

    <g transform="translate(840, 1290)">
      <rect x="0" y="0" width="220" height="50" class="card shadow"/>
      <text x="110" y="32" class="card-text" text-anchor="middle">Alembic Migrations</text>
    </g>

    <g transform="translate(1080, 1290)">
      <rect x="0" y="0" width="220" height="50" class="card shadow"/>
      <text x="110" y="32" class="card-text" text-anchor="middle">CI / CD Pipeline</text>
    </g>

    <g transform="translate(1320, 1290)">
      <rect x="0" y="0" width="220" height="50" class="card shadow"/>
      <text x="110" y="32" class="card-text" text-anchor="middle">Agent Evaluations</text>
    </g>

    <g transform="translate(1560, 1290)">
      <rect x="0" y="0" width="220" height="50" class="card shadow"/>
      <text x="110" y="32" class="card-text" text-anchor="middle">Monitor Loop</text>
    </g>
  </g>
</svg>
