    <rect class="badge badge-monitor" x="930" y="485" width="36" height="36"/>
    <text x="948" y="509" class="layer-num" text-anchor="middle">7</text>
    <text x="976" y="509" class="layer-title" fill="#1d4ed8">Monitoring &amp; Alerts</text>

    <rect class="panel panel-monitor" x="930" y="485" width="420" height="100"/>

    <rect class="card" x="950" y="535" width="120" height="35"/>
    <text x="1010" y="557" class="card-title" text-anchor="middle">Monitors</text>

    <rect class="card" x="1090" y="535" width="120" height="35"/>
    <text x="1150" y="557" class="card-title" text-anchor="middle">Alert Events</text>

    <rect class="card" x="1230" y="535" width="100" height="35"/>
    <text x="1280" y="557" class="card-title" text-anchor="middle">Scheduler</text>
  </g>

  <!-- Layer 9: Safety &amp; Compliance -->
