    <rect class="badge badge-engine" x="470" y="265" width="36" height="36"/>
    <text x="488" y="289" class="layer-num" text-anchor="middle">4</text>
    <text x="516" y="289" class="layer-title" fill="#2c5282">Agent Engine</text>

    <rect class="panel panel-engine" x="470" y="265" width="410" height="220"/>

    <rect class="card" x="490" y="315" width="370" height="45"/>
    <text x="675" y="333" class="card-title" text-anchor="middle">AgentKernel Graph Runtime</text>
    <text x="675" y="348" class="card-text" text-anchor="middle">intent → plan → approve → execute → reflect → report</text>

    <rect class="card" x="490" y="375" width="370" height="40"/>
    <text x="675" y="393" class="card-title" text-anchor="middle">Planner + Tool Calling</text>
    <text x="675" y="407" class="card-text" text-anchor="middle">market / RAG / Memory / BitPro MCP / live intents</text>

