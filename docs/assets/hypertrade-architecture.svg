    <rect class="badge badge-output" x="930" y="265" width="36" height="36"/>
    <text x="948" y="289" class="layer-num" text-anchor="middle">6</text>
    <text x="976" y="289" class="layer-title" fill="#0f766e">Execution &amp; Output</text>

    <rect class="panel panel-output" x="930" y="265" width="420" height="200"/>
    <text x="940" y="293" class="small-text">Risk-gated, paper-first, no mainnet in V1</text>

    <rect class="card" x="950" y="315" width="380" height="35"/>
    <text x="1140" y="337" class="card-title" text-anchor="middle">Operator Reports</text>
    <text x="1240" y="337" class="card-text">CLI / Web / API — structured Markdown + JSON</text>

    <rect class="card" x="950" y="365" width="180" height="40"/>
    <text x="1040" y="383" class="card-title" text-anchor="middle">BitPro Strategy Lifecycle</text>
    <text x="1040" y="397" class="card-text" text-anchor="middle">create / backtest / validate</text>

    <rect class="card" x="1150" y="365" width="180" height="40"/>
    <text x="1240" y="383" class="card-title" text-anchor="middle">Paper Trading Runtime</text>
    <text x="1240" y="397" class="card-text" text-anchor="middle">sessions / positions / fills</text>

    <rect class="card" x="950" y="420" width="380" height="35"/>
    <text x="1140" y="442" class="card-title" text-anchor="middle">Risk-Gated Execution</text>
    <text x="1270" y="442" class="card-text">OKX Testnet only — Mainnet blocked</text>
  </g>

  <!-- Layer 7: Monitoring &amp; Alerts -->
