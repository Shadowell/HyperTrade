    <text x="140" y="840" class="card-text" text-anchor="middle">Vide Coding / DeepSeek</text>
    <text x="140" y="850" class="small-text" text-anchor="middle">OpenAI / Codex / Qwen</text>

    <rect class="card" x="250" y="805" width="180" height="50"/>
