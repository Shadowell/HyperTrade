    <rect class="badge badge-world" x="470" y="525" width="36" height="36"/>
    <text x="488" y="549" class="layer-num" text-anchor="middle">5</text>
    <text x="516" y="549" class="layer-title" fill="#7c2d12">World Model (Sprint 71-74)</text>

    <rect class="panel panel-world" x="470" y="525" width="410" height="200"/>

    <rect class="card" x="490" y="575" width="175" height="50"/>
    <text x="578" y="593" class="card-title" text-anchor="middle">WorldState Snapshot</text>
    <text x="578" y="610" class="card-text" text-anchor="middle">global + crypto state</text>

    <rect class="card" x="685" y="575" width="175" height="50"/>
    <text x="772" y="593" class="card-title" text-anchor="middle">Scenario Decision</text>
    <text x="772" y="610" class="card-text" text-anchor="middle">action scoring</text>

    <rect class="card" x="490" y="640" width="175" height="50"/>
    <text x="578" y="658" class="card-title" text-anchor="middle">Defensive Automation</text>
    <text x="578" y="675" class="card-text" text-anchor="middle">allowlist gate</text>

    <rect class="card" x="685" y="640" width="175" height="50"/>
    <text x="772" y="658" class="card-title" text-anchor="middle">Portfolio Scheduler</text>
    <text x="772" y="675" class="card-text" text-anchor="middle">allocation review</text>
  </g>

