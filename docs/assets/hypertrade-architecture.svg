<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200">
  <defs>
    <style>
      .title{font:bold 56px system-ui,sans-serif;fill:#1a202c}
      .subtitle{font:500 18px system-ui,sans-serif;fill:#4a5568}
      .layer-num{font:bold 24px system-ui,sans-serif;fill:#fff}
      .layer-title{font:bold 20px system-ui,sans-serif}
      .card-title{font:600 15px system-ui,sans-serif;fill:#1a202c}
      .card-text{font:400 12px system-ui,sans-serif;fill:#4a5568}
      .small-text{font:400 11px system-ui,sans-serif;fill:#718096}

      .panel{fill:#fff;stroke-width:2;rx:8}
      .panel-client{stroke:#3182ce}
      .panel-data{stroke:#38a169}
      .panel-governance{stroke:#805ad5}
      .panel-engine{stroke:#2b6cb0}
      .panel-world{stroke:#dd6b20}
      .panel-output{stroke:#0d9488}
      .panel-monitor{stroke:#2563eb}
      .panel-safety{stroke:#e53e3e}
      .panel-infra{stroke:#2563eb}
      .panel-workflow{stroke:#2563eb}

      .badge{rx:20}
      .badge-client{fill:#3182ce}
      .badge-data{fill:#38a169}
      .badge-governance{fill:#805ad5}
      .badge-engine{fill:#2b6cb0}
      .badge-world{fill:#dd6b20}
      .badge-output{fill:#0d9488}
      .badge-monitor{fill:#2563eb}
      .badge-safety{fill:#e53e3e}
      .badge-infra{fill:#2563eb}
      .badge-workflow{fill:#2563eb}

      .arrow{stroke:#3182ce;stroke-width:3;fill:none;marker-end:url(#arrowhead)}
      .card{fill:#fff;stroke:#cbd5e0;stroke-width:1.5;rx:6}
    </style>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3182ce"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1900" height="1200" fill="#fafbfc"/>

  <!-- Title -->
  <text x="950" y="60" class="title" text-anchor="middle">Hyper<tspan fill="#3182ce">Trade</tspan></text>
  <text x="950" y="85" class="subtitle" text-anchor="middle">AI-Native Crypto Trading Agent — Research, Strategy, Risk-Gated Execution</text>

  <!-- ========== LAYER 1: CLIENT ACCESS (Top, Full Width) ========== -->
  <g id="layer-1">
    <rect class="badge badge-client" x="30" y="120" width="36" height="36"/>
    <text x="48" y="144" class="layer-num" text-anchor="middle">1</text>
    <text x="76" y="144" class="layer-title" fill="#2c5282">Client / Agent Access</text>

    <!-- Client cards -->
    <rect class="card" x="230" y="120" width="130" height="50"/>
    <text x="295" y="140" class="card-title" text-anchor="middle">CLI / ht</text>
    <text x="295" y="158" class="card-text" text-anchor="middle">Terminal</text>

    <rect class="card" x="380" y="120" width="130" height="50"/>
    <text x="445" y="140" class="card-title" text-anchor="middle">/harness</text>
    <text x="445" y="158" class="card-text" text-anchor="middle">Web Console</text>

    <rect class="card" x="530" y="120" width="130" height="50"/>
    <text x="595" y="140" class="card-title" text-anchor="middle">REST / SSE</text>
    <text x="595" y="158" class="card-text" text-anchor="middle">API</text>

    <rect class="card" x="680" y="120" width="170" height="50"/>
    <text x="765" y="140" class="card-title" text-anchor="middle">Codex / External Agent</text>
    <text x="765" y="158" class="card-text" text-anchor="middle">Integration</text>

    <rect class="card" x="870" y="120" width="130" height="50"/>
    <text x="935" y="140" class="card-title" text-anchor="middle">Custom Agent</text>
    <text x="935" y="158" class="card-text" text-anchor="middle">Extension</text>

    <rect class="card" x="1020" y="120" width="150" height="50" stroke-dasharray="5,5"/>
    <text x="1095" y="140" class="card-title" text-anchor="middle">Future MCP</text>
    <text x="1095" y="158" class="card-text" text-anchor="middle">Clients</text>

    <!-- FastAPI Boundary -->
    <rect class="panel panel-client" x="230" y="185" width="940" height="35"/>
    <text x="700" y="207" class="card-text" text-anchor="middle" fill="#2c5282">FastAPI Boundary: Agent Runs / Streaming / Admin-Gated Mutations</text>
  </g>

  <!-- Arrow from Layer 1 down -->
  <path class="arrow" d="M 700 220 L 700 245"/>

  <!-- ========== LEFT COLUMN: Data + Governance ========== -->

  <!-- Layer 2: Data &amp; Inputs -->
  <g id="layer-2">
    <rect class="badge badge-data" x="30" y="265" width="36" height="36"/>
    <text x="48" y="289" class="layer-num" text-anchor="middle">2</text>
    <text x="76" y="289" class="layer-title" fill="#22543d">Data &amp; Inputs</text>

    <rect class="panel panel-data" x="30" y="265" width="390" height="220"/>

    <rect class="card" x="50" y="315" width="170" height="65"/>
    <text x="135" y="333" class="card-title" text-anchor="middle">OKX 行情数据</text>
    <text x="135" y="350" class="card-text" text-anchor="middle">SWAP tickers / candles</text>
    <text x="135" y="365" class="card-text" text-anchor="middle">funding / OI</text>

    <rect class="card" x="240" y="315" width="160" height="65"/>
    <text x="320" y="333" class="card-title" text-anchor="middle">BitPro MCP / API</text>
    <text x="320" y="350" class="card-text" text-anchor="middle">K线 / 策略 / 回测</text>
    <text x="320" y="365" class="card-text" text-anchor="middle">模拟盘 / 实盘诊断</text>

    <rect class="card" x="50" y="395" width="170" height="65"/>
    <text x="135" y="413" class="card-title" text-anchor="middle">RAG / Knowledge</text>
    <text x="135" y="430" class="card-text" text-anchor="middle">docs/knowledge</text>
    <text x="135" y="445" class="card-text" text-anchor="middle">pgvector 语义检索</text>

    <rect class="card" x="240" y="395" width="160" height="65"/>
    <text x="320" y="413" class="card-title" text-anchor="middle">Audited Memory</text>
    <text x="320" y="430" class="card-text" text-anchor="middle">策略证据 / 运行结论</text>
    <text x="320" y="445" class="card-text" text-anchor="middle">失败原因沉淀</text>
  </g>

  <!-- Arrow from Data to Governance -->
