    <rect class="badge badge-safety" x="930" y="605" width="36" height="36"/>
    <text x="948" y="629" class="layer-num" text-anchor="middle">9</text>
    <text x="976" y="629" class="layer-title" fill="#991b1b">Safety &amp; Compliance</text>

