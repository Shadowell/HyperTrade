<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)"/>

  <!-- Chart/Trading icon -->
  <!-- Candlestick chart representation -->
  <g transform="translate(50, 60)">
    <!-- Candle 1 -->
    <line x1="10" y1="30" x2="10" y2="50" stroke="#fff" stroke-width="2" opacity="0.8"/>
    <rect x="5" y="35" width="10" height="12" fill="#4ade80" opacity="0.9"/>

    <!-- Candle 2 -->
    <line x1="30" y1="25" x2="30" y2="55" stroke="#fff" stroke-width="2" opacity="0.8"/>
    <rect x="25" y="28" width="10" height="22" fill="#ef4444" opacity="0.9"/>

    <!-- Candle 3 -->
    <line x1="50" y1="20" x2="50" y2="45" stroke="#fff" stroke-width="2" opacity="0.8"/>
    <rect x="45" y="25" width="10" height="15" fill="#4ade80" opacity="0.9"/>

    <!-- Candle 4 -->
    <line x1="70" y1="15" x2="70" y2="40" stroke="#fff" stroke-width="2" opacity="0.8"/>
    <rect x="65" y="18" width="10" height="18" fill="#4ade80" opacity="0.9"/>

    <!-- Candle 5 -->
    <line x1="90" y1="10" x2="90" y2="35" stroke="#fff" stroke-width="2" opacity="0.8"/>
    <rect x="85" y="13" width="10" height="17" fill="#4ade80" opacity="0.9"/>
  </g>

  <!-- AI/Agent brain icon overlay -->
  <g transform="translate(100, 130)">
    <!-- Neural network nodes -->
    <circle cx="0" cy="0" r="6" fill="url(#accentGradient)" opacity="0.9"/>
    <circle cx="-20" cy="-10" r="5" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="20" cy="-10" r="5" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="-15" cy="10" r="4" fill="url(#accentGradient)" opacity="0.7"/>
    <circle cx="15" cy="10" r="4" fill="url(#accentGradient)" opacity="0.7"/>

    <!-- Neural connections -->
    <line x1="0" y1="0" x2="-20" y2="-10" stroke="#f5576c" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="20" y2="-10" stroke="#f5576c" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="-15" y2="10" stroke="#f5576c" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="15" y2="10" stroke="#f5576c" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- "HT" monogram -->
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">HT</text>
</svg>
